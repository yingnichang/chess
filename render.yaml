services:
  - type: web
    name: ny-chess-tournament-finder
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CACHE_MAX_AGE_HOURS
        value: "24"
      - key: MONTHS_AHEAD
        value: "6"
      - key: REFRESH_TOKEN
        generateValue: true

  - type: cron
    name: ny-chess-tournament-refresh
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python render_refresh.py
    schedule: "0 12 * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: WEB_APP_HOSTPORT
        fromService:
          type: web
          name: ny-chess-tournament-finder
          property: hostport
      - key: REFRESH_TOKEN
        fromService:
          type: web
          name: ny-chess-tournament-finder
          envVarKey: REFRESH_TOKEN
